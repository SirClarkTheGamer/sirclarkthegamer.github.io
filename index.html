<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
        // Wait for the window to finish loading
        window.addEventListener('DOMContentLoaded', () => {
            // Get the initial title text and add a little spacing at the end
            let titleText = document.title + "   "; 

            // Set the interval to animate the text every 200 milliseconds
            setInterval(() => {
                // Move the first character to the end of the string
                titleText = titleText.substring(1) + titleText.substring(0, 1);
                // Update the browser tab title
                document.title = titleText;
            }, 200); // 200ms = speed of the scroll (lower is faster)
        });
    </script> 
  <style>
        body {
      margin: 0;
      padding: 0;
      min-height: 200vh; /* Make the page tall enough to scroll */
      background-color: #ffffff;
      
      /* Checkerboard pattern using CSS gradients */
      background-image: 
        linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%, #ccc), 
        linear-gradient(-45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%, #ccc);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      
      /* Ensure the background scrolls naturally with the page */
      background-attachment: scroll; 
    }

    .content {
      padding: 50px;
      font-family: sans-serif;
    }
    </style>
<title>cool site</title>
</head>

<body>
<p>hello world</p><img src="ultrakill-v1.gif" alt="v1 ultrakill" width="500" height="600">
</body>

</html>
